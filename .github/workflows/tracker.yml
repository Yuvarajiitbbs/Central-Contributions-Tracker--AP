name: AP Central Tracker
on:
  schedule:
    - cron: "*/30 * * * *"   # backup restart only
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for news every ~5 minutes for ~50 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          end=$((SECONDS+3000))
          while [ $SECONDS -lt $end ]; do
            python tracker.py || true
            git add seen.json ledger.csv 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "update" && git pull --rebase -q && git push -q || true
            fi
            sleep 120
          done
      - name: Start the next run (self-restart)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml --ref main
